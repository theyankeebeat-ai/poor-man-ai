name: Vercel Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Vercel CLI
        shell: pwsh
        run: npm install --global vercel@65.4.0

      - name: Require VERCEL_TOKEN
        shell: pwsh
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VERCEL_TOKEN)) {
            Write-Error "Missing repository secret VERCEL_TOKEN. Create a token at https://vercel.com/account/tokens and set it with: gh secret set VERCEL_TOKEN --repo theyankeebeat-ai/poor-man-ai"
            exit 1
          }

      - name: Deploy production
        shell: pwsh
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # Container service builds on Vercel (Dockerfile). Do not use --prebuilt.
        run: vercel deploy --prod --yes --token $env:VERCEL_TOKEN
